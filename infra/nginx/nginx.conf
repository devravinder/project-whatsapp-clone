worker_processes 1;

events {
  worker_connections 4096;
}

http {
  # The servers run on the host, not in compose.
  upstream chat {
    # Round robin on purpose: two tabs usually land on different servers.
    server host.docker.internal:4001 max_fails=1 fail_timeout=5s;
    server host.docker.internal:4002 max_fails=1 fail_timeout=5s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 4000;

    location / {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # A dead server: try the other one for idempotent requests.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
    }

    location /ws {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      # Longer than the 15 s server ping, so idle sockets are not cut.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
